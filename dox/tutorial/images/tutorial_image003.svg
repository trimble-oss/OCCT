<svg xmlns="http://www.w3.org/2000/svg" width="465.602" height="182.463" aria-labelledby="title description" role="img" viewBox="0 0 1200 470"><title id="title">Bottle profile points</title><desc id="description">Five points in the XY plane used to construct the bottle profile.</desc><defs><marker id="arrow" markerHeight="8" markerUnits="strokeWidth" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#202124" d="M 0 0 L 8 4 L 0 8 Z"/></marker></defs><rect width="1200" height="470" fill="#fff"/><g fill="none" stroke="#202124" stroke-linecap="round" stroke-width="2.5" marker-end="url(#arrow)"><path d="M 25 130 H 1150"/><path d="M 600 445 V 20"/></g><g fill="#202124" font-family="DejaVu Sans, Arial, sans-serif" font-size="20"><text x="1170" y="137" font-style="italic">x</text><text x="609" y="20" font-style="italic">y</text></g><circle cx="600" cy="130" r="5" fill="#d1495b"/><text x="610" y="121" fill="#6b7280" font-family="DejaVu Sans, Arial, sans-serif" font-size="15">origin (0, 0, 0)</text><g fill="#1267d6" stroke="#fff" stroke-width="2"><circle cx="170" cy="130" r="8"/><circle cx="170" cy="280" r="8"/><circle cx="600" cy="410" r="8"/><circle cx="1030" cy="280" r="8"/><circle cx="1030" cy="130" r="8"/></g><g fill="#111827" font-family="DejaVu Sans, Arial, sans-serif" font-size="20"><text x="60" y="95">P1 (-myWidth / 2., 0, 0)</text><text x="30" y="325">P2 (-myWidth / 2., -myThickness / 4., 0)</text><text x="620" y="420">P3 (0, -myThickness / 2., 0)</text><text x="1170" y="325" text-anchor="end">P4 (myWidth / 2., -myThickness / 4., 0)</text><text x="1130" y="95" text-anchor="end">P5 (myWidth / 2., 0, 0)</text></g></svg>